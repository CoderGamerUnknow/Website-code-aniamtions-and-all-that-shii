name: Checks

# Three layers, all of them part of the build:
#
#   checks  - lint and the unit tests: the code the site is made of.
#   audit   - a real browser against the production bundle: the behaviour a
#             visitor gets. It fails the job when an animation regresses, when
#             a control stops being reachable from the keyboard, or when the
#             console starts complaining.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The audit uses the WebSocket client from the standard library,
          # which needs Node 22 or newer.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and audit the production bundle
        run: npm run audit:anim
        env:
          # The runner ships Chrome; the audit looks for it by itself, but
          # the path is pinned here so a change of the image cannot break it.
          CHROME_PATH: /usr/bin/google-chrome

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animation-audit-report
          path: .freebuff/audit/report.json
          if-no-files-found: ignore
